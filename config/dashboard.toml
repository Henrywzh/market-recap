# Dashboard contract. Everything a renderer needs to name a panel lives here,
# never inline in a builder.

[brand]
# The published name of YOUR tool. Do not set this to the name of a firm you
# are not, or the page becomes an impersonation rather than a dashboard.
title = "MARKET RECAP"
subtitle = "POST-MARKET RECAP DASHBOARD"
disclaimer = "internal research tool. Not investment advice."

[universe]
# Broad-market quote strip on the MARKETS tab.
quote_tickers = ["SPY", "QQQ", "IWM"]
# Years of index history to pull for the long drawdown and price charts.
history_years = 11
# The ETF whose weekly returns the DCF tab regresses against for beta, and the
# curve tenor its risk-free rate defaults to. Both are shown to the user as
# what they are, so both have to be stateable rather than buried in the model.
market_proxy = "SPY"
risk_free_tenor = "10Y"

# Every index the page covers, defined once. The builder loops over this list:
# adding a third index is a config change, not a code change, and nothing can
# drift between "which basket do we price" and "which basket do we label".
#
# ``holdings_etf`` is the fund whose published basket supplies the weights.
# Weights come from the issuer's own file, never from an approximate market
# cap, which is what makes the contribution column mean anything.
[[universe.indices]]
key = "SPX"
label = "S&P 500"
symbol = "^GSPC"
holdings_etf = "SPY"
holdings_label = "SPDR S&P 500 ETF daily holdings"
primary = true            # the basket the sector tables and DCF universe use

[[universe.indices]]
key = "NDX"
label = "Nasdaq 100"
symbol = "^NDX"
holdings_etf = "QNDX"
holdings_label = "SPDR Portfolio Nasdaq-100 daily holdings"

# Which windows each table offers. Labels must exist in PERIOD_TRADING_DAYS.
[periods]
sector_table = ["1D", "1W", "1M", "3M", "YTD"]
watchlist = ["1D", "1W", "1M", "3M", "YTD", "1Y"]
commodities = ["1D", "1W", "1M", "3M", "YTD"]
heatmap = ["1D", "1W", "1M", "3M", "YTD", "1Y"]
index_price_chart = ["1M", "3M", "6M", "YTD", "1Y", "3Y", "5Y", "10Y"]
breadth_chart = ["1M", "3M", "6M", "YTD", "1Y", "2Y"]
sector_rebased = ["1M", "3M", "6M", "1Y", "3Y"]
# Display periods on the TECHNICALS charts. Indicators are computed on the full
# history first and then cut to the period, so a 200-day average is already
# formed on the first day shown.
technicals_chart = ["6M", "1Y", "2Y", "3Y", "5Y", "10Y"]
# Sessions of chart history baked into each per-ticker artifact.
chart_window = "2Y"
# yfinance history length for the commodity table and its chart. It has to
# cover the longest window the table offers or that column is silently always
# blank; the chart shows all of it (daily for the last year, weekly before).
commodity_history = "10y"

# Rolling windows for the breadth and trend tables on MARKETS.
[breadth]
above_ma_windows = [5, 20, 50, 100, 200]
slope_lookbacks = [5, 20, 50, 100, 200]

# Corporate actions the price feed does not adjust for (see
# src/market_recap/corporate_actions.py). Yahoo adjusts for splits and
# dividends but not spin-offs, so a spun-off parent shows the distribution as a
# loss. ``ratio`` is shares of ``distributed`` received per share held, read
# from the company's filing; the adjustment factor is computed from both lines'
# prices on ``ex_date`` and is not typed in. The build downloads both lines
# for that even after the index drops one; if either still has no price on
# ``ex_date``, history before the date is dropped instead.
[[corporate_actions]]
ticker = "CTVA"
kind = "spin-off"
ex_date = "2026-10-01"
distributed = "VYLR"
ratio = 1.0
source = "https://www.sec.gov/Archives/edgar/data/0001755672/000119312526414490/ck0001755672-20260929.htm"
note = "Corteva distributed its seed business, Vylor Inc., one share per Corteva share (record date 2026-09-24); Vylor began regular-way trading on 2026-10-01."

# A recent one-session move this large with no split on record is listed as a
# notice, because it may be a distribution that needs an entry above. News
# produces these too (a bid, an earnings gap), so it is a prompt to look and
# never blocks a build.
[price_checks]
drop_pct = 60
rise_pct = 150
sessions = 10

# INDUSTRIES view (src/market_recap/compute/industries.py): each sub-industry
# and sector as the median of its members, beside the evidence that tells a
# fall the estimates explain from one they do not. Evidence is listed, never
# scored (docs/information_architecture.md); a reading is flagged only where it
# crosses a threshold written here beforehand.
[industries]
min_members = 3             # a group of fewer names is not a reading and is not shown
thin_below = 5              # fewer names than this: shown, marked thin (a median of three is noise)
ma_sessions = 200           # trend: the share of names above their average of this many sessions
# A group is SOLD OFF when its median 1M return is at or below this and at
# least this share of its names fell over the month (one name's crash is not
# an industry's).
sold_off_return_pct = -6.0
sold_off_down_share = 0.8
# Estimates are CUT when the median FY1 EPS revision is below either figure
# (percent over 30 and 90 days). A revision under half a percent is noise: with
# the 90-day line at zero, Insurance Brokers' median of -0.04% read as a cut.
# Only names whose EPS is positive are read: a percentage off a loss is not a
# revision.
estimates_cut_30d_pct = -0.5
estimates_cut_90d_pct = -0.5
# P/E is CHEAP against its own ten years at or below this percentile.
cheap_percentile = 50.0
# Sectors where P/E is not the multiple (a REIT is valued on funds from
# operations): neither the forward P/E nor its percentile is shown.
no_pe_sectors = ["Real Estate"]

[sectors]
# SECTORS hub. Which THEMES group's industry data appears on a sector's or a
# sub-industry's page; a THEMES group mapped to neither is listed as cross-sector.
sector_themes = { "Energy" = "energy", "Consumer Staples" = "staples", "Consumer Discretionary" = "consumer" }
sub_industry_themes = { "Semiconductors" = "semis", "Diversified Banks" = "banks", "Regional Banks" = "banks", "Homebuilding" = "housing", "Hotels, Resorts & Cruise Lines" = "cruise", "Aerospace & Defense" = "defense" }
# VALUATION's subsector bands (P/E and P/TBV against ten years) shown on these sub-industries' pages.
sub_industry_valuation = { "Diversified Banks" = "fin-diversified-banks", "Regional Banks" = "fin-regional-banks", "Investment Banking & Brokerage" = "fin-investment-banks" }
# A page's P/E band and aggregate multiples need at least this many names with a
# ten-year weekly P/E history; fewer and the page's multiples are left blank.
valuation_min_members = 5

# Intraday prices, fetched in the reader's browser through
# functions/api/quotes.js (Yahoo's spark, 20 symbols a call; CNBC for the
# yields). Beside the recap, never inside it: every other figure on the page
# is the nightly build's close. The strip leads MARKETS and OVERVIEW; the
# boards are the heat map's members (from the heat-map artifact) and the index
# charts on INDICES.
[live]
refresh_seconds = 60        # the strip, while the session is open and the tab visible
closed_refresh_seconds = 300  # how often a closed session checks whether it has opened
server_cache_seconds = 15   # repeated clicks and readers share one fetch per window
stale_after_seconds = 1200  # during the session, an older price is marked STALE
board_refresh_seconds = 300   # heat map and index charts, while the session is open
board_closed_refresh_seconds = 900
board_cache_seconds = 60
manual_min_seconds = 30     # REFRESH asks again, but not sooner than this after the last fetch
# The strip: cash indices, volatility, the dollar and two commodities (Yahoo
# chart symbols), then a second row of names to watch.
strip = [
  { symbol = "^GSPC", label = "SPX", kind = "index" },
  { symbol = "^NDX", label = "NDX", kind = "index" },
  { symbol = "^RUT", label = "RUT", kind = "index" },
  { symbol = "^DJI", label = "DOW", kind = "index" },
  { symbol = "^VIX", label = "VIX", kind = "macro" },
  { symbol = "DX-Y.NYB", label = "DXY", kind = "macro" },
  { symbol = "CL=F", label = "WTI", kind = "macro" },
  { symbol = "GC=F", label = "GOLD", kind = "macro" },
]
strip_names = ["SKHY", "GOOG", "NVDA", "AMD"]
# The INDICES intraday charts.
index_board = [
  { symbol = "^GSPC", label = "S&P 500" },
  { symbol = "^NDX", label = "Nasdaq 100" },
  { symbol = "^RUT", label = "Russell 2000" },
  { symbol = "^DJI", label = "Dow Jones" },
]
# Overnight board; these are Yahoo chart symbols, never proxies for cash SPX/NDX.
overnight = [
  { symbol = "ES=F", label = "S&P 500 futures", region = "US" },
  { symbol = "NQ=F", label = "Nasdaq 100 futures", region = "US" },
  { symbol = "^N225", label = "Nikkei 225", region = "Asia" },
  { symbol = "^HSI", label = "Hang Seng", region = "Asia" },
  { symbol = "^FTSE", label = "FTSE 100", region = "Europe" },
  { symbol = "^GDAXI", label = "DAX", region = "Europe" },
]
# Bounded scan: top current SPX names by issuer weight from the existing heat-map
# artifact, plus the watchlist. These names are fallback if that artifact is
# unavailable during a partial build. Not a full-US-market mover screen.
premarket_top_weight_names = 30
premarket_movers = ["AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "AVGO", "TSLA", "JPM", "LLY"]
# The strip's yields: Cboe's Treasury yield indexes through Yahoo (5, 10 and
# 30 years; there is no 2-year). CNBC refuses Cloudflare's servers (HTTP 403
# since 2026-10-12), so `source = "cnbc"` is kept only for the REFRESH board.
rates = [
  { symbol = "^FVX", label = "UST 5Y", source = "yahoo" },
  { symbol = "^TNX", label = "UST 10Y", source = "yahoo" },
  { symbol = "^TYX", label = "UST 30Y", source = "yahoo" },
]
# Pages that take live prices only when the reader presses REFRESH: SECTORS
# (the heat-map board for its baskets, plus the SPDR sector funds beside them),
# the commodity table on MACRO (its own symbols, [macro.commodities]) and the
# Treasury table (CNBC's on-the-run yields, one call for the whole curve).
sector_benchmark = "SPY"
sector_etfs = [
  { symbol = "XLK", sector = "Information Technology" },
  { symbol = "XLF", sector = "Financials" },
  { symbol = "XLV", sector = "Health Care" },
  { symbol = "XLY", sector = "Consumer Discretionary" },
  { symbol = "XLC", sector = "Communication Services" },
  { symbol = "XLI", sector = "Industrials" },
  { symbol = "XLP", sector = "Consumer Staples" },
  { symbol = "XLE", sector = "Energy" },
  { symbol = "XLU", sector = "Utilities" },
  { symbol = "XLRE", sector = "Real Estate" },
  { symbol = "XLB", sector = "Materials" },
]
# CNBC symbol per tenor; the labels are the Treasury table's own tenors.
yield_board = [
  { symbol = "US1M", label = "1M" }, { symbol = "US2M", label = "2M" }, { symbol = "US3M", label = "3M" },
  { symbol = "US4M", label = "4M" }, { symbol = "US6M", label = "6M" }, { symbol = "US1Y", label = "1Y" },
  { symbol = "US2Y", label = "2Y" }, { symbol = "US3Y", label = "3Y" }, { symbol = "US5Y", label = "5Y" },
  { symbol = "US7Y", label = "7Y" }, { symbol = "US10Y", label = "10Y" }, { symbol = "US20Y", label = "20Y" },
  { symbol = "US30Y", label = "30Y" },
]

# Names to follow that no tracked index carries. A watchlist entry gets the
# same price treatment as an index member and is never mixed into an index's
# breadth, weight or advance/decline figures -- it is not a constituent.
[[watchlist]]
ticker = "SKHY"
label = "SK hynix"
note = "Nasdaq-listed line; first session 2026-07-10, so long-window figures are short."

[[watchlist]]
ticker = "TSM"
label = "TSMC (ADR)"

[[watchlist]]
ticker = "ASML"
label = "ASML (ADR)"

[[watchlist]]
ticker = "ARM"
label = "Arm Holdings (ADR)"

# Two listings of the same company, priced against each other.
#
# ``ratio`` is how many home-market shares one US line represents. It must come
# from the depositary's own filing, never from today's prices: reverse-engineer
# it and the premium is zero by construction and the panel plots a flat line
# forever. ``ratio_source`` is where it was read, so the number can be checked.
[[cross_listing]]
us_ticker = "SKHY"
home_ticker = "000660.KS"
home_market = "Korea (KRX)"
fx_ticker = "KRW=X"
fx_note = "KRW per USD"
label = "SK hynix"
ratio = 0.1
ratio_source = "SEC 424B4 filed 2026-07-10 (accession 0001193125-26-299963): 'Each ADS represents one-tenth of a common share.'"
ratio_url = "https://www.sec.gov/Archives/edgar/data/2120882/000119312526299963/d32785d424b4.htm"
