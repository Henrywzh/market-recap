[technicals]
# Presets offered by the relative-strength control.
presets = [
  "XLK/SPY", "XLF/SPY", "XLE/SPY", "XLV/SPY", "XLY/XLP",
  "IWM/SPY", "QQQ/SPY", "SOXX/SPY", "EFA/SPY", "GLD/SPY",
]
ma_periods = [20, 50, 200]
zscore_window = 200
forward_return_days = 40
# Sigma band drawn around the long average. 1.5 is the edge of the "above /
# below trend" band in the z-score table, so the shaded band and the table
# describe the same threshold instead of two unrelated ones.
band_sigma = 1.5
# Enough history for a short average and a MACD to mean anything. A ticker
# below this carries no technical reading at all; between this and
# ``zscore_window`` it carries the readings its history supports and names the
# rest with what they would need.
min_sessions = 40
# MACD spans. Not the 12/26/9 default: these match the reference dashboard
# this page reproduces, and a MACD read against a differently-tuned one is a
# different indicator.
macd_fast = 8
macd_slow = 17
macd_signal = 9
# Per-day slope of each average is measured over this many sessions, and so is
# the annualised slope of the long average. Editable on the page.
slope_window = 5
# Moving averages drawn on a relative-strength ratio.
ratio_ma_periods = [60, 200]
# The period each chart opens on (one of periods.technicals_chart).
single_ticker_period = "1Y"
ratio_period = "5Y"

# EARNINGS (under CATALYSTS): FactSet's Earnings Insight figures, a daily
# bottom-up revision tracker from each member's consensus trend, and the
# reporting season from Nasdaq's calendar. ``estimates`` switches the tracker.
[earnings]
estimates = true

# MONITOR: a research queue, not a signal. A name enters when its adjusted
# close is threshold_pct below its drawdown_period high, or when its
# relative_period return trails its sector peers' median (other index members,
# the company excluded) by peer_excess_pp. The watchlist above is measured
# too, as explicit non-members. Manual watch/exclude reasons live in
# config/monitor_notes.toml.
[monitor]
index = "SPX"
drawdown_period = "1Y"
threshold_pct = 20.0
relative_period = "1M"
ma_sessions = 20
earnings_days = 30
peer_excess_pp = 10.0
# A sector is weak as a whole when its ETF trails the market AND its median
# member trails the median of all members, each by this much over
# relative_period (cap-weighted against cap-weighted, equal against equal).
sector_event_pp = 3.0
# FY1 consensus EPS moving this much in 30 days counts as a cut or a raise.
revision_pct = 2.0
min_analysts = 3
# A reported quarter counts as evidence for this many days.
report_days = 100
expectations = true
# The published artifact is the durable observation ledger for cloud builds.
published_base_url = "https://market-recap-b5p.pages.dev"

[financials]
# Every member of these indices gets ten fiscal years of filed statements.
# Baked at build time for the same reason as the DCF: data.sec.gov sends no
# CORS header. IFRS filers (ASML, ARM) are listed as skipped, with the reason.
indices = ["SPX", "NDX"]
history_years = 10
# Names outside the S&P 500 and Nasdaq-100 that K-SHAPE and THEMES read. They
# get filings and prices as members do, but carry no index membership, so no
# index figure counts them. An IFRS filer among them is skipped, as above.
extra = ["VIK", "TOL", "CZR", "ALLY"]
# Their GICS sector and sub-industry and name, which no index list gives them: the
# sector picks a bank's below-the-line earnings basis and ranks each within it.
extra_names = [
  { ticker = "VIK", name = "Viking Holdings", sector = "Consumer Discretionary", sub_sector = "Hotels, Resorts & Cruise Lines" },
  { ticker = "TOL", name = "Toll Brothers", sector = "Consumer Discretionary", sub_sector = "Homebuilding" },
  { ticker = "CZR", name = "Caesars Entertainment", sector = "Consumer Discretionary", sub_sector = "Casinos & Gaming" },
  { ticker = "ALLY", name = "Ally Financial", sector = "Financials", sub_sector = "Consumer Finance" },
]

[dcf]
# Fundamentals are baked at build time: data.sec.gov sends no CORS header, so
# the browser cannot reach it. A ticker not baked here cannot be modelled.
max_tickers = 120
forecast_years = 5
history_years = 5
# Beta is computed here rather than read off a vendor so the page can state
# exactly what it is: OLS on weekly returns against the market proxy.
beta_weeks = 104
beta_min_weeks = 52

[macro]
# Monthly prints shown in the inflation table.
releases = 12
# Years of each inflation series carried for its chart.
history_years = 10

[macro.cpi]
history_years = 10
percentile_min_months = 60
# Partition for attribution: no parent and its children in the same sum.
contribution_keys = ["food", "energy", "core"]
components = [
  { key = "headline", label = "Headline CPI", bls = "All items", series_id = "CPIAUCSL" },
  { key = "core", label = "Core CPI", bls = "All items less food and energy", series_id = "CPILFESL" },
  { key = "food", label = "Food", bls = "Food", series_id = "CPIUFDSL" },
  { key = "energy", label = "Energy", bls = "Energy", series_id = "CPIENGSL" },
  { key = "core_goods", label = "Core goods", bls = "Commodities less food and energy commodities", series_id = "CUSR0000SACL1E" },
  { key = "core_services", label = "Services ex energy", bls = "Services less energy services", series_id = "CUSR0000SASLE" },
  { key = "shelter", label = "Shelter", bls = "Shelter", series_id = "CUSR0000SAH1" },
  { key = "rent", label = "Rent", bls = "Rent of primary residence", series_id = "CUSR0000SEHA" },
  { key = "oer", label = "Owners’ equivalent rent", bls = "Owners' equivalent rent of residences", series_id = "CUSR0000SEHC" },
  { key = "gasoline", label = "Gasoline", bls = "Gasoline (all types)", series_id = "CUSR0000SETB01" },
  { key = "new_vehicles", label = "New vehicles", bls = "New vehicles", series_id = "CUSR0000SETA01" },
  { key = "used_vehicles", label = "Used vehicles", bls = "Used cars and trucks", series_id = "CUSR0000SETA02" },
  { key = "medical", label = "Medical services", bls = "Medical care services", series_id = "CUSR0000SAM2" },
  { key = "airfares", label = "Airfares", bls = "Airline fares", series_id = "CUSR0000SETG01" },
]
persistence = [
  { key = "sticky", label = "Sticky CPI", series_id = "STICKCPIM159SFRBATL", unit = "YoY %", display = "level" },
  { key = "core_sticky", label = "Core sticky CPI", series_id = "CORESTICKM159SFRBATL", unit = "YoY %", display = "level" },
  { key = "median", label = "Median CPI", series_id = "MEDCPIM158SFRBCLE", unit = "1M ann. %", display = "level" },
  { key = "trimmed", label = "16% trimmed-mean CPI", series_id = "TRMMEANCPIM158SFRBCLE", unit = "1M ann. %", display = "level" },
]

[fixed_income]
# Calendar days back for each curve comparison. Calendar, not trading days:
# Treasury publishes the curve on a calendar schedule, and "1 week ago" for a
# published curve means the date a week earlier, not five sessions earlier.
# ``label`` names the curve on the chart, ``column`` heads the change column.
comparisons = [
  { key = "week_ago", label = "1 Week Ago", column = "1W", days = 7 },
  { key = "month_ago", label = "1 Month Ago", column = "1M", days = 30 },
]
spreads = [
  { label = "10Y - 2Y", long = "10Y", short = "2Y" },
  { label = "10Y - 3M", long = "10Y", short = "3M" },
]
# The yields-over-time chart: FRED's constant-maturity series (the same
# Treasury yields, one file each), daily for the last year, weekly before.
history_years = 10
history_series = [
  { label = "2Y", series_id = "DGS2" },
  { label = "10Y", series_id = "DGS10" },
  { label = "30Y", series_id = "DGS30" },
]
history_spread = { label = "10Y − 2Y", long = "10Y", short = "2Y" }

[cross_listing_diagnostics]
# A premium series whose day-to-day changes carry less memory than this is
# reporting the gap between two trading sessions rather than a dislocation.
min_autocorrelation = 0.3
# Sample floors. Below these the diagnostics are noise about noise.
min_sessions = 20
min_correlation_pairs = 10
history_period = "2y"

# Recorded history that cannot be downloaded later (src/market_recap/snapshots,
# docs/information_architecture.md). Nothing here feeds the page yet. The
# scheduled job checks the `snapshots` branch out at `root` and commits what
# each run appends.
[snapshots]
root = "data/snapshots"

[snapshots.options]
# New York wall-clock window on weekdays: from late in the session to
# midnight. GitHub starts scheduled runs hours late (every options run in the
# first week landed 18:56-20:27, outside a 15:10-16:00 window, and skipped).
# Options stop trading at 16:00, so a later run records the closing quotes,
# which is what an after-close report is priced on; a contract whose bid or
# ask has gone to zero is not used (compute.options.mid_quote), and the meta
# file says whether the copy was taken after the close.
window = ["15:10", "23:59"]
close = "16:00"
# Recorded every session so each has a continuous IV history: index and
# sector ETFs, rates/credit/gold funds and the largest index weights.
fixed = [
  "SPY", "QQQ", "IWM", "DIA",
  "XLK", "XLF", "XLE", "XLV", "XLY", "XLP", "XLI", "XLU", "XLB", "XLRE", "XLC", "SMH",
  "TLT", "HYG", "GLD",
  "AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "AVGO", "TSLA", "JPM", "LLY",
]
include_watchlist = true
# Names reporting within report_days (calendar), read from the published
# events.json, soonest first: the session's closing straddle is the implied
# move on their event card.
report_days = 3
report_max = 40
# MONITOR candidates added on top, read from the published monitor.json: those
# reporting within monitor_earnings_days first, then the furthest behind peers.
monitor_max = 15
monitor_earnings_days = 30
# Expiries: the nearest at least min_days out, plus those either side of each
# target (calendar days), so a constant-maturity vol can be interpolated later.
min_days = 2
target_days = [30, 60]
# Contracts kept raw: strikes within this fraction of spot.
strike_band = 0.25
# Discount rate: 13-week T-bill yield, in percent.
rate_symbol = "^IRX"
time_budget_seconds = 1200

[snapshots.expectations]
fed_funds_months = 12
sofr_quarters = 8
kalshi_series = ["KXFEDDECISION", "KXFED", "KXCPIYOY", "KXCPICOREYOY", "KXPAYROLLS", "KXU3", "KXGDP"]
polymarket_tags = ["fed", "fed-rates"]

# Risk inputs as each publisher served them that evening (snapshots/risk.py):
# the last ``tail`` observations of each series, so revisions show up as a
# difference between two evenings' files.
[snapshots.risk]
tail = 30
fred = ["BAMLH0A0HYM2", "BAMLC0A0CM", "BAMLH0A3HYC", "BAMLH0A1HYBB", "BAMLH0A2HYB", "BAMLC0A4CBBB", "NFCI", "ANFCI"]
cboe = ["VIX", "VIX9D", "VIX3M", "VIX6M", "VIX1Y", "VVIX", "SKEW", "COR1M"]
# ETFs whose issuer publishes only today's units (CUSIP from [etf_xray.holdings]):
# recorded each evening so their flow can be built from the record.
invesco = ["QQQ", "RSP"]

