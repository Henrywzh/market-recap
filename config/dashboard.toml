[technicals]
# Presets offered by the relative-strength control.
presets = [
  "XLK/SPY", "XLF/SPY", "XLE/SPY", "XLV/SPY", "XLY/XLP",
  "IWM/SPY", "QQQ/SPY", "SOXX/SPY", "EFA/SPY", "GLD/SPY",
]
ma_periods = [20, 50, 200]
zscore_window = 200
forward_return_days = 40
# Sigma band drawn around the long average. 1.5 is the edge of the "above /
# below trend" band in the z-score table, so the shaded band and the table
# describe the same threshold instead of two unrelated ones.
band_sigma = 1.5
# Enough history for a short average and a MACD to mean anything. A ticker
# below this carries no technical reading at all; between this and
# ``zscore_window`` it carries the readings its history supports and names the
# rest with what they would need.
min_sessions = 40
# MACD spans. Not the 12/26/9 default: these match the reference dashboard
# this page reproduces, and a MACD read against a differently-tuned one is a
# different indicator.
macd_fast = 8
macd_slow = 17
macd_signal = 9
# Per-day slope of each average is measured over this many sessions, and so is
# the annualised slope of the long average. Editable on the page.
slope_window = 5
# Moving averages drawn on a relative-strength ratio.
ratio_ma_periods = [60, 200]
# The period each chart opens on (one of periods.technicals_chart).
single_ticker_period = "1Y"
ratio_period = "5Y"

# EARNINGS (under CATALYSTS): FactSet's Earnings Insight figures, a daily
# bottom-up revision tracker from each member's consensus trend, and the
# reporting season from Nasdaq's calendar. ``estimates`` switches the tracker.
[earnings]
estimates = true

# MONITOR: a research queue, not a signal. A name enters when its adjusted
# close is threshold_pct below its drawdown_period high, or when its
# relative_period return trails its sector peers' median (other index members,
# the company excluded) by peer_excess_pp. The watchlist above is measured
# too, as explicit non-members. Manual watch/exclude reasons live in
# config/monitor_notes.toml.
[monitor]
index = "SPX"
drawdown_period = "1Y"
threshold_pct = 20.0
relative_period = "1M"
ma_sessions = 20
earnings_days = 30
peer_excess_pp = 10.0
# A sector is weak as a whole when its ETF trails the market AND its median
# member trails the median of all members, each by this much over
# relative_period (cap-weighted against cap-weighted, equal against equal).
sector_event_pp = 3.0
# FY1 consensus EPS moving this much in 30 days counts as a cut or a raise.
revision_pct = 2.0
min_analysts = 3
# A reported quarter counts as evidence for this many days.
report_days = 100
expectations = true
# The published artifact is the durable observation ledger for cloud builds.
published_base_url = "https://market-recap-b5p.pages.dev"

[financials]
# Every member of these indices gets ten fiscal years of filed statements.
# Baked at build time for the same reason as the DCF: data.sec.gov sends no
# CORS header. IFRS filers (ASML, ARM) are listed as skipped, with the reason.
indices = ["SPX", "NDX"]
history_years = 10

[dcf]
# Fundamentals are baked at build time: data.sec.gov sends no CORS header, so
# the browser cannot reach it. A ticker not baked here cannot be modelled.
max_tickers = 120
forecast_years = 5
history_years = 5
# Beta is computed here rather than read off a vendor so the page can state
# exactly what it is: OLS on weekly returns against the market proxy.
beta_weeks = 104
beta_min_weeks = 52

[macro]
# Monthly prints shown in the inflation table.
releases = 12

[fixed_income]
# Calendar days back for each curve comparison. Calendar, not trading days:
# Treasury publishes the curve on a calendar schedule, and "1 week ago" for a
# published curve means the date a week earlier, not five sessions earlier.
# ``label`` names the curve on the chart, ``column`` heads the change column.
comparisons = [
  { key = "week_ago", label = "1 Week Ago", column = "1W", days = 7 },
  { key = "month_ago", label = "1 Month Ago", column = "1M", days = 30 },
]
spreads = [
  { label = "10Y - 2Y", long = "10Y", short = "2Y" },
  { label = "10Y - 3M", long = "10Y", short = "3M" },
]

[cross_listing_diagnostics]
# A premium series whose day-to-day changes carry less memory than this is
# reporting the gap between two trading sessions rather than a dislocation.
min_autocorrelation = 0.3
# Sample floors. Below these the diagnostics are noise about noise.
min_sessions = 20
min_correlation_pairs = 10
history_period = "2y"
