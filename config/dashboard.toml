[events]
# Event cards (CATALYSTS lead strip, TICKER page) and per-name timelines.
# Cards cover reports within card_horizon_days; the CATALYSTS page leads with
# those in the next lead_days from names at or above either index weight (%)
# or on the watchlist.
card_horizon_days = 30
lead_days = 7
lead_min_spx_weight = 0.25
lead_min_ndx_weight = 0.5
# Read-through: the candidates are the names whose daily excess returns were
# most correlated over the lookback; each is scored on the company's own
# reaction sessions, and needs readthrough_min_reports of them.
readthrough_lookback_sessions = 252
readthrough_candidates = 12
readthrough_min_reports = 4
# A peer needs the same GICS industry, a shared theme, or this correlation;
# and a positive report-day beta whose t-statistic reaches readthrough_min_t
# (about 1 chance pass in 12 candidates at eight reports).
readthrough_strong_corr = 0.45
readthrough_min_t = 2.0
readthrough_show = 5
# High-importance macro dates carried onto every timeline.
timeline_days_ahead = 45
# Large moves (2.5 sigma of the name's own, at least 2%) over moves_days, with
# Finnhub headlines for the last news_days, at most news_budget new requests a
# build (60 a minute; a settled day is kept a year).
moves_days = 730
news_days = 365
news_budget = 250
# Company events announced ahead, read from the deep names' last
# event_news_days of headlines (event_news_budget requests a build).
event_news_days = 45
event_news_budget = 150
