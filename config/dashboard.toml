# Dashboard contract. Everything a renderer needs to name a panel lives here,
# never inline in a builder.

[brand]
# The published name of YOUR tool. Do not set this to the name of a firm you
# are not, or the page becomes an impersonation rather than a dashboard.
title = "MARKET RECAP"
subtitle = "POST-MARKET RECAP DASHBOARD"
disclaimer = "internal research tool. Not investment advice."

[universe]
# Broad-market quote strip on the MARKETS tab.
quote_tickers = ["SPY", "QQQ", "IWM"]
# Years of index history to pull for the long drawdown and price charts.
history_years = 11
# The ETF whose weekly returns the DCF tab regresses against for beta, and the
# curve tenor its risk-free rate defaults to. Both are shown to the user as
# what they are, so both have to be stateable rather than buried in the model.
market_proxy = "SPY"
risk_free_tenor = "10Y"

# Every index the page covers, defined once. The builder loops over this list:
# adding a third index is a config change, not a code change, and nothing can
# drift between "which basket do we price" and "which basket do we label".
#
# ``holdings_etf`` is the fund whose published basket supplies the weights.
# Weights come from the issuer's own file, never from an approximate market
# cap, which is what makes the contribution column mean anything.
[[universe.indices]]
key = "SPX"
label = "S&P 500"
symbol = "^GSPC"
holdings_etf = "SPY"
holdings_label = "SPDR S&P 500 ETF daily holdings"
primary = true            # the basket the sector tables and DCF universe use

[[universe.indices]]
key = "NDX"
label = "Nasdaq 100"
symbol = "^NDX"
holdings_etf = "QNDX"
holdings_label = "SPDR Portfolio Nasdaq-100 daily holdings"

# Which windows each table offers. Labels must exist in PERIOD_TRADING_DAYS.
[periods]
sector_table = ["1D", "1W", "1M", "3M", "YTD"]
watchlist = ["1D", "1W", "1M", "3M", "YTD", "1Y"]
commodities = ["1D", "1W", "1M", "3M", "YTD"]
heatmap = ["1D", "1W", "1M", "3M", "YTD", "1Y"]
index_price_chart = ["1M", "3M", "6M", "YTD", "1Y", "3Y", "5Y", "10Y"]
breadth_chart = ["1M", "3M", "6M", "YTD", "1Y", "2Y"]
sector_rebased = ["1M", "3M", "6M", "1Y", "3Y"]
# Display periods on the TECHNICALS charts. Indicators are computed on the full
# history first and then cut to the period, so a 200-day average is already
# formed on the first day shown.
technicals_chart = ["6M", "1Y", "2Y", "3Y", "5Y", "10Y"]
# Sessions of chart history baked into each per-ticker artifact.
chart_window = "2Y"
# yfinance history length for the commodity table. It has to cover the longest
# window the table offers or that column is silently always blank.
commodity_history = "2y"

# Rolling windows for the breadth and trend tables on MARKETS.
[breadth]
above_ma_windows = [5, 20, 50, 100, 200]
slope_lookbacks = [5, 20, 50, 100, 200]

# Names to follow that no tracked index carries. A watchlist entry gets the
# same price treatment as an index member and is never mixed into an index's
# breadth, weight or advance/decline figures -- it is not a constituent.
[[watchlist]]
ticker = "SKHY"
label = "SK hynix"
note = "Nasdaq-listed line; first session 2026-07-10, so long-window figures are short."

[[watchlist]]
ticker = "TSM"
label = "TSMC (ADR)"

[[watchlist]]
ticker = "ASML"
label = "ASML (ADR)"

[[watchlist]]
ticker = "ARM"
label = "Arm Holdings (ADR)"

# Two listings of the same company, priced against each other.
#
# ``ratio`` is how many home-market shares one US line represents. It must come
# from the depositary's own filing, never from today's prices: reverse-engineer
# it and the premium is zero by construction and the panel plots a flat line
# forever. ``ratio_source`` is where it was read, so the number can be checked.
[[cross_listing]]
us_ticker = "SKHY"
home_ticker = "000660.KS"
home_market = "Korea (KRX)"
fx_ticker = "KRW=X"
fx_note = "KRW per USD"
label = "SK hynix"
ratio = 0.1
ratio_source = "SEC 424B4 filed 2026-07-10 (accession 0001193125-26-299963): 'Each ADS represents one-tenth of a common share.'"
ratio_url = "https://www.sec.gov/Archives/edgar/data/2120882/000119312526299963/d32785d424b4.htm"
home_close_lead_hours = 14

