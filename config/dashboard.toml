# Cruise lines: no ETF isolates them, so the proxy is an equal-weight basket of
# the three in the S&P 500. Viking is left out (listed 2024, in no tracked
# index). Fuel, rates and credit (the lines are heavily indebted) and the
# consumer are what bear on them; bookings and yield guidance, the real driver,
# come with the reports.
# drivers: what the names' daily excess return is regressed on (the last 252
# sessions). kind: pct (a symbol's daily % change), diff (its daily change in
# points), pair_pct (the first symbol's % change less the second's), fred_bp (a
# FRED series' daily change in basis points).
[[themes.groups]]
key = "cruise"
label = "CRUISE"
basket = ["CCL", "RCL", "NCLH"]
bellwethers = ["CCL", "RCL", "NCLH"]
macro = ["petroleum", "Consumer Sentiment|Michigan", "Retail sales", "CPI", "jobless claims", "FOMC"]
drivers_note = "Correlation and beta of each name's daily return beyond the S&P 500 with the day's move in each driver. Over 2010-2026 the cruise basket fell on the days the VIX and the dollar rose, and, in the last three years, with oil and the 10-year yield; the same beta measured in consecutive years correlated only 0.3 to 0.4, so read a beta as a tendency of the last year. History, not a forecast."
drivers = [
  { key = "vix", label = "VIX, per point", kind = "diff", symbol = "^VIX" },
  { key = "oil", label = "WTI, per 1%", kind = "pct", symbol = "CL=F" },
  { key = "ten_year", label = "10-year yield, per 1bp", kind = "fred_bp", series = "DGS10" },
  { key = "credit", label = "HYG less LQD, per 1%", kind = "pair_pct", symbols = ["HYG", "LQD"] },
  { key = "usd", label = "dollar (UUP), per 1%", kind = "pct", symbol = "UUP" },
]

# Defense primes, as an equal-weight basket: the iShares US Aerospace & Defense
# fund (ITA) also holds Boeing, GE Aerospace and suppliers, and its daily
# excess return moved with none of the market drivers (R-squared 0.006 against
# 0.058 for the primes). Backlog growth (XBRL) and DoD contract obligations
# (USAspending) were tested against later excess returns and did not lead them.
[[themes.groups]]
key = "defense"
label = "DEFENSE"
basket = ["LMT", "RTX", "NOC", "GD", "LHX", "HII"]
bellwethers = ["LMT", "RTX", "NOC", "GD", "LHX", "HII"]
macro = ["FOMC", "Durable Goods", "Factory Orders"]
drivers_note = "Correlation and beta of each name's daily return beyond the S&P 500 with the day's move in each driver. The primes have been defensive: since 2017 they outperformed on days the VIX rose (a rising beta to it, strongest in the last three years) and, in the last three years, on days credit sold off and oil and gold rose. The VIX beta persisted from one year to the next (correlation 0.6); the others did less. History, not a forecast."
drivers = [
  { key = "vix", label = "VIX, per point", kind = "diff", symbol = "^VIX" },
  { key = "oil", label = "WTI, per 1%", kind = "pct", symbol = "CL=F" },
  { key = "gold", label = "gold (GLD), per 1%", kind = "pct", symbol = "GLD" },
  { key = "ten_year", label = "10-year yield, per 1bp", kind = "fred_bp", series = "DGS10" },
  { key = "credit", label = "HYG less LQD, per 1%", kind = "pair_pct", symbols = ["HYG", "LQD"] },
]

# Consumer staples: the Select Sector SPDR (XLP) is the proxy. It is in the
# sector list (universe.sectors), so its prices come with the sector ETFs and
# need no wiring. Drivers: the 10-year yield (staples as bond substitutes), the
# dollar (much of their revenue is abroad), VIX (flight to safety) and sugar
# futures (an input cost).
[[themes.groups]]
key = "staples"
label = "STAPLES"
etf = "XLP"
bellwethers = ["WMT", "COST", "PG", "KO", "PM", "PEP"]
# Two names side by side: return gap by window, the ratio's history, correlation.
pairs = [
  { a = "KO", b = "PEP", note = "Coca-Cola sells drinks almost only, mostly as concentrate to bottlers; PepsiCo is about half food (Frito-Lay, Quaker) and bottles much of its own drink volume. A rising ratio means KO is ahead." },
]
macro = ["CPI", "Retail sales", "PCE", "FOMC"]
drivers_note = "Correlation and beta of each name's daily return beyond the S&P 500 with the day's move in each driver. Over the last year the names rose beyond the market on days the VIX rose (beta +0.41 to +0.50 per point, correlation 0.34 to 0.53) and on days the dollar rose (correlation 0.06 to 0.23, the reverse of what foreign earnings translation would suggest). The 10-year yield and sugar showed no reliable link, with correlations between -0.10 and +0.18. History, not a forecast."
drivers = [
  { key = "ten_year", label = "10-year yield, per 1bp", kind = "fred_bp", series = "DGS10" },
  { key = "usd", label = "dollar (UUP), per 1%", kind = "pct", symbol = "UUP" },
  { key = "vix", label = "VIX, per point", kind = "diff", symbol = "^VIX" },
  { key = "sugar", label = "sugar futures (SB=F), per 1%", kind = "pct", symbol = "SB=F" },
]

[valuation]
# MARKET -> SECTORS: a sector is divided into the groups below, by GICS
# sub-industry (the S&P 500 labels on Wikipedia), so a Financials multiple is
# not one number over banks, brokers, insurers and payment networks. A group
# with fewer than this many companies is not drawn.
subgroup_min_members = 3

[valuation.scenario]
# MARKET -> SECTORS, "WHAT YOU WOULD NEED TO BELIEVE": the price change implied
# by moving a group's forward multiple by these many turns and revising its
# next-twelve-months consensus EPS by these percentages. The axes are choices;
# the arithmetic (price = multiple x EPS) lives in compute/valuation.py.
multiple_turns = [-3, -2, -1, 0, 1, 2, 3]
eps_change_pct = [-10, -5, 0, 5, 10]

# Financials, by what earns the money. Each sub-industry belongs to one group;
# one no group names (e.g. Multi-Sector Holdings) stays in the sector's total
