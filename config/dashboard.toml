# Each group: a proxy (an ETF, or an equal-weight basket of members when no
# ETF isolates the theme), bellwethers whose past reports are scored against
# that proxy, and the macro releases (regex on CATALYSTS titles) that bear on
# it. The industry data for the first two groups is built in the panel.
calendar_days = 42
etfs = ["SMH", "KRE", "XRT", "ITB"]
