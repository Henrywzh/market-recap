[catalyst_log]
# CALENDAR -> UNSCHEDULED CATALYSTS. Dated events no calendar announces (a leak,
# a competitor's announcement, a supply report), kept by hand with their source,
# and the names the coverage tied to each. For each: the exposed names' price
# since the close before the event, and how far consensus EPS and revenue (the
# nightly snapshots, from 2026-10-01) have moved since the snapshot at that
# close. The exposed list is a judgment; it is not a measured exposure.
# A median move of at least ``price_move_pct`` (percent) counts as a price move
# and of at least ``revision_pct`` as an estimate revision; fewer than
# ``min_names`` names with a recorded estimate gives no reading (a basket of two
# is a pair, and the page says how many names it rests on).
price_move_pct = 3.0
revision_pct = 1.0
min_names = 2
periods = ["0q", "0y", "+1y"]
period_labels = { "0q" = "THIS QUARTER", "0y" = "THIS YEAR", "+1y" = "NEXT YEAR" }
# The estimate the reading is taken from.
read_period = "0y"

# ``after_close = true`` when the news broke after the day's close: the day's own
# close is then the reference. Otherwise the reference is the close before the date.
[[catalyst_log.items]]
key = "toshiba_hdd_2026_10_02"
date = "2026-10-02"
title = "Toshiba reported to plan doubling hard disk output"
kind = "supply"
detail = "Reported by 24/7 Wall St. (no original source named): Toshiba, the smallest of the three hard disk makers, would double capacity centred on its Philippines plant, with a medium-term goal of 30% of the market by capacity. Seagate fell 10% and Western Digital 7% in morning trading that day."
