# PRICED PATH (RISK -> PRICED PATH): meeting probabilities from fed funds
# futures beside Kalshi and Polymarket. A meeting where Kalshi's expected
# change differs from the futures' by more than disagreement_bp is flagged,
# not averaged.
[priced]
fed_funds_months = 13
sofr_quarters = 8
disagreement_bp = 10
releases_per_series = 2

# OVERVIEW: earnings in the next three sessions are listed for watchlist
# names and the top_weights largest index members.
[overview]
top_weights = 20

# Ticker evidence and options (NAMES -> TICKER, CATALYSTS -> EARNINGS).
# Earnings reactions cover every member; insider, short-interest and rating
# data cover the focus names only (watchlist, MONITOR queue and the
# top_weights largest members). A short-interest change of at least
# short_change_pct over a month is listed as evidence; an IV percentile is
# shown only after iv_percentile_min_days of recorded snapshots.
[evidence]
top_weights = 30
# MONITOR candidates in focus, chosen by the options snapshot's own rule.
monitor_max = 15
insider_window_days = 90
form4_budget_seconds = 300
short_change_pct = 20
iv_percentile_min_days = 60
# A cluster buy (two or more insiders within 30 days) must total at least
# cluster_min_value; a single insider's open-market buy is listed from
# single_buy_min_value.
cluster_min_value = 250000
single_buy_min_value = 1000000
# Foreign private issuers report on Form 6-K, which has no item code: their
# earnings release is recognised by the document name they file it under.
# Both release overnight New York time, so the reaction is that day's session.
[evidence.six_k]
TSM = { pattern = '^tsm-\d{8}x6k\.htm$', timing = "bmo" }
ASML = { pattern = 'quarterlyfilings', timing = "bmo" }
