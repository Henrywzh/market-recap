[catalysts]
# Days ahead the tab lists, and sessions in the week strip at its top.
horizon_days = 30
# High-importance macro events (FOMC, CPI, payrolls, GDP) are listed this far out.
high_importance_horizon_days = 45
week_sessions = 5
# An earnings report's importance is the company's weight in the S&P 500 or
# Nasdaq-100 (percent): a 1% name moves the index on its own.
earnings_high_weight = 1.0
earnings_medium_weight = 0.25

# Scheduled events shown, matched by a regular expression against the title in
# the source's own calendar; anything unmatched is left off. ``prints`` names
# the FRED series whose latest observation is shown as the previous print,
# with the transform applied (level / yoy / mom / change) and the unit shown.
# ``expect_within_days``: the release recurs at least this often, so finding no
# match that far ahead in the agency's calendar means its title changed and
# the pattern no longer matches -- a quiet drop the page then reports.
# Sources: bls, bea, census, fed (Federal Reserve Board calendar), treasury
# (announced coupon auctions), rule (computed from a fixed rule).
# expect names which forecasts to show. The questions live in compute/expectations.py.
[[catalysts.releases]]
source = "bls"
match = "^Employment Situation$"
label = "Employment report"
importance = "high"
expect_within_days = 40
prints = [
  { series = "PAYEMS", transform = "change", label = "Payrolls", unit = "k", decimals = 0 },
  { series = "UNRATE", transform = "level", label = "Unemployment", unit = "%", decimals = 1 },
]
expect = ["nfp", "unrate"]

[[catalysts.releases]]
source = "bls"
match = "^Consumer Price Index$"
label = "CPI"
importance = "high"
expect_within_days = 40
prints = [
  { series = "CPIAUCSL", transform = "yoy", label = "CPI y/y", unit = "%", decimals = 1 },
  { series = "CPILFESL", transform = "yoy", label = "Core y/y", unit = "%", decimals = 1 },
]
expect = ["cpi_yoy", "core_cpi_yoy", "cpi_mom", "core_cpi_mom"]

[[catalysts.releases]]
source = "bls"
match = "^Producer Price Index$"
label = "PPI"
importance = "medium"
prints = [{ series = "PPIFIS", transform = "yoy", label = "Final demand y/y", unit = "%", decimals = 1 }]

[[catalysts.releases]]
