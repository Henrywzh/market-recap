[kshape]
# RELATIVE VALUE -> K-SHAPE. A high-income leg against a low-income leg, within an
# industry: what each leg's price, trailing P/E and earnings growth have done, as
# ratios (top over bottom) with where today's ratio sits in its own history. The
# legs are a judgment, named here by hand: top = customers mostly wealthy
# (luxury, premium cabins, premium resorts), bottom = mostly low-income
# households. The squeezed middle (LULU, RL, TPR, WSM) is left out of the
# spreads. Windows are named in config.PERIOD_TRADING_DAYS. A name with no
# history in the index data (VIK, TOL, CZR, ALLY) has its prices fetched here
# and no valuation history.
history_years = 10
price_periods = ["1M", "3M", "6M", "1Y", "3Y", "5Y"]
# A trailing P/E counts when it is positive and at most pe_cap; a date counts
# when at least pe_min_share of the names with a history that day are meaningful.
pe_cap = 60
pe_min_share = 0.5
# Year-on-year EPS growth beyond this size (off a profit near zero) is not drawn.
eps_growth_cap = 150
# Names in the bottom leg of the overall view with no listed top-leg counterpart.
bottom_only = ["MCD", "YUM", "DPZ", "DG", "DLTR"]
overall_label = "ALL PAIRS"

[[kshape.pairs]]
key = "cruise"
label = "CRUISE"
top = ["VIK"]
bottom = ["RCL", "CCL", "NCLH"]
note = "Viking sells river and ocean cruises to older, wealthier travellers and listed in May 2024, so its history starts there and it has no valuation history. The mass-market lines are the comparison."

[[kshape.pairs]]
key = "airlines"
label = "AIRLINES"
top = ["DAL", "UAL"]
bottom = ["LUV"]
note = "Delta and United earn a large share of revenue from premium cabins and corporate travel; Southwest is the mass-market comparison (it has been adding premium seating, so the line is blurring)."

[[kshape.pairs]]
key = "homebuilders"
label = "HOMEBUILDERS"
top = ["TOL"]
bottom = ["DHI", "LEN"]
note = "Toll Brothers builds luxury homes for buyers who do not need a mortgage to the same degree; D.R. Horton and Lennar sell mostly entry-level and move-up homes, which depend on mortgage rates and incentives."

[[kshape.pairs]]
key = "casinos"
label = "CASINOS"
top = ["WYNN", "LVS"]
bottom = ["MGM", "CZR"]
note = "Wynn and Las Vegas Sands run premium resorts (Macau, the Strip's top end); MGM and Caesars lean on mass-market Strip and regional gamblers."

[[kshape.pairs]]
key = "cards"
label = "CARDS & LENDING"
top = ["AXP"]
bottom = ["COF", "SYF", "ALLY"]
note = "American Express's cardholders skew affluent; Capital One, Synchrony and Ally lend more to near-prime and subprime households, where delinquencies show stress first."

[overnight]
# INDICES -> OVERNIGHT VS INTRADAY. Each fund's daily return split into the
# move from the previous close to the open and the move from the open to the
# close, since its first day (Yahoo's split-adjusted opens and closes, the
# dividend in the overnight leg). Windows are named in config.PERIOD_TRADING_DAYS;
# MAX is since inception.
windows = ["1M", "3M", "1Y", "3Y", "5Y", "10Y", "MAX"]
funds = [
  { symbol = "SPY", label = "S&P 500 (SPY)" },
  { symbol = "QQQ", label = "Nasdaq-100 (QQQ)" },
  { symbol = "IWM", label = "Russell 2000 (IWM)" },
]

[sizek]
# RELATIVE VALUE -> SIZE K. One arm of a pair against the other, as a ratio (big
# over small) with where today's ratio sits in its own history. Size pairs: the
# large, cap-weighted arm against the equal-weight or smaller arm of much the same
# market. Style pairs: value against growth, a sector or a low-volatility fund
# against the market. ETF pairs use adjusted closes (dividends included); the UK
# pair is two price indexes (no dividends), in pounds. Windows are named in
# config.PERIOD_TRADING_DAYS; ``gap_period`` is the rolling window of the
# big-less-small return. ``big_name`` / ``small_name`` default to the symbol.
# ``big_arm`` / ``small_arm`` are the labels the page prints for the two arms
# (default LARGE / SMALL; a style pair names its own, e.g. VALUE / GROWTH).
# ``source = "french"`` takes a pair's two arms from Kenneth French's daily size
# and book-to-market portfolios (sources.french), not from Yahoo: factor series
# built as price indexes from the portfolios' returns, before fees and trading
# costs. The file is monthly and runs a month or more behind; history_years cuts
# it to the same window as the other pairs.
# ``big_basket`` / ``small_basket`` give each arm a basket of names whose trailing
# P/E and earnings are built from VALUATION (SEC filings and closes), so the gap
# can be split into a re-rating and an earnings difference: "index:SPX" (S&P 500
# members, cap-weighted; ":equal" for equal weight), "index:NDX" likewise,
# "sector:<GICS sector>" (S&P 500 members), "holdings:<iShares fund>" (the fund's
# own holding weights, looked through to the names). ``*_basket_label`` names a
# fund's arm on the page. A pair with no baskets says why in ``fundamentals_note``.
history_years = 25
price_periods = ["1M", "3M", "6M", "1Y", "3Y", "5Y", "10Y"]
gap_period = "1Y"

[[sizek.pairs]]
key = "sp500"
label = "S&P 500: CAP vs EQUAL"
big = "SPY"
small = "RSP"
big_basket = "index:SPX"
small_basket = "index:SPX:equal"
note = "The same 500 companies: SPY weights them by market value, RSP gives each the same weight and rebalances quarterly. The gap is the return of the largest names against the typical one."

[[sizek.pairs]]
