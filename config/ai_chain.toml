# The AI supply chain: who sells to whom, and who competes with whom.
#
# Hand-kept, read by the CHAIN panel (panels/chain.py). This is today's graph:
# a link that formed in 2024 is applied to 2016's reports too, so the CHAIN
# study is labelled "current graph", never point-in-time evidence.
#
# [[nodes]]: key is the site's ticker (a US line where one trades, else the
#   home listing), yahoo the price/earnings symbol when it differs, market the
#   exchange whose session and index the moves are measured on, releases the
#   market whose hours a report with no clock time is read in (an ADR's home:
#   ASML publishes at 07:00 in Amsterdam, TSMC in the Taipei afternoon).
# [[edges]]: type
#   supplies  -- `from` sells to each of `to` (chips, tools, power, capacity).
#   competes  -- the same customers' spend, so a beat can be share taken.
#   partner   -- joint venture or co-design; neither side buys the other's output.
#   `to` may name a group (@hyperscalers): the filings say "cloud customers"
#   without naming them, and the edge says so (named = false).
# scripts/chain_evidence.py checks each edge against the SEC filings of both
# sides and writes config/ai_chain_evidence.json; an edge neither side's
# filings name carries the `source` given here instead.

# Each exchange: its time zone, cash close, the index moves are measured
# against, and when a report with no clock time is taken to have come out
# ("bmo" an hour before the open, "amc" just after the close -- the local habit).
[markets]
US = { tz = "America/New_York", close = "16:00", index = "^GSPC", unknown = "amc" }
KR = { tz = "Asia/Seoul", close = "15:30", index = "^KS11", unknown = "bmo" }
TW = { tz = "Asia/Taipei", close = "13:30", index = "^TWII", unknown = "amc" }
JP = { tz = "Asia/Tokyo", close = "15:30", index = "^N225", unknown = "amc" }
NL = { tz = "Europe/Amsterdam", close = "17:30", index = "^AEX", unknown = "bmo" }
FR = { tz = "Europe/Paris", close = "17:30", index = "^FCHI", unknown = "bmo" }
DE = { tz = "Europe/Berlin", close = "17:30", index = "^GDAXI", unknown = "bmo" }

[groups]
hyperscalers = ["MSFT", "GOOGL", "AMZN", "META", "ORCL"]
memory = ["000660.KS", "MU", "005930.KS"]
foundry = ["TSM", "005930.KS", "INTC"]
odms = ["2317.TW", "2382.TW", "6669.TW", "3231.TW"]

[[layers]]
key = "ip"
label = "IP & EDA"
[[layers]]
key = "equipment"
label = "EQUIPMENT & MATERIALS"
[[layers]]
key = "foundry"
label = "FOUNDRY & PACKAGING"
[[layers]]
key = "memory"
label = "MEMORY & STORAGE"
[[layers]]
key = "chips"
label = "ACCELERATORS & CHIPS"
[[layers]]
key = "network"
label = "NETWORKING & OPTICS"
[[layers]]
key = "systems"
label = "SERVERS & ODMs"
[[layers]]
key = "power"
label = "POWER & COOLING"
[[layers]]
key = "capacity"
label = "DATA CENTERS & NEOCLOUDS"
[[layers]]
key = "cloud"
label = "HYPERSCALERS"

