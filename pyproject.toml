[project]
name = "market-recap"
version = "0.1.0"
description = "Post-market recap dashboard built entirely on free, attributable data sources."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "yfinance>=0.2.65",
    "openpyxl>=3.1",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
market-recap = "market_recap.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
