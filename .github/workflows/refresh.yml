# Nightly refresh + deploy. Runs on GitHub's machines, so whether it happens
# does not depend on a laptop lid being open at the right minute.
name: refresh

on:
  schedule:
    # GitHub cron is UTC. 23:47 UTC is 19:47 New York in summer (EDT) and 18:47
    # in winter (EST): after the evening publishers (State Street holdings/NAV,
    # Treasury's par curve) and the 18:30 session rollover year-round, with no
    # DST arithmetic to redo twice a year -- 17 minutes clear of the rollover in
    # winter rather than 7. Off the hour and half hour, which GitHub delays most.
    - cron: "47 23 * * 1-5"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to Cloudflare Pages after a passing build"
        type: boolean
        default: true

# Two overlapping runs would race on the deploy; a manual run queues instead.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The lock, not pyproject's ranges: a clean machine otherwise resolves the
      # newest release that night, and an upgrade should be a commit.
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          npm ci

      - name: Test
        run: make test PYTHON=python

      # The cache is politeness and speed, not state: every artifact rebuilds
      # from the publishers, so an evicted cache costs one slow run, never a
      # wrong number. Each run saves under its own key and restores the newest
      # -- but only one written by the same locked library versions. A cache
      # built by pandas 3 / yfinance 1 once put the page a session behind.
      - name: Restore cache
        uses: actions/cache/restore@v6
        with:
          path: data/cache
          key: data-cache-${{ hashFiles('requirements.lock') }}-${{ github.run_id }}
          restore-keys: data-cache-${{ hashFiles('requirements.lock') }}-

      # Recorded rates and options pricing, read by PRICED PATH and the ticker
      # page. Read-only and optional: a missing branch leaves those sections
      # saying "not recorded yet".
      - name: Check out recorded snapshots
        continue-on-error: true
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" snapshots >/dev/null; then
            git clone -q --depth 1 --branch snapshots --single-branch "$REMOTE" data/snapshots
          fi

      - name: Refresh
        id: refresh
        # A failed build is judged by the gate below, then fails the run at the end.
        continue-on-error: true
        env:
          # Restore the last published ledgers (MONITOR observations, the earnings
          # season's captured year-ago EPS), never an evictable cache.
          MONITOR_PUBLISHED_STATE: "1"
          # THEMES reads alternative-data's files and asks GitHub which commit
          # last touched each; the anonymous API limit is 60 an hour per IP.
          GITHUB_TOKEN: ${{ github.token }}
        # --strict: nobody reads an unattended run's output, so a warning is a
        # failure. A red run emails the repo owner; a stale page does not.
        run: make refresh REFRESH_FLAGS=--strict

      - name: Archive monitor observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monitor-${{ github.run_id }}
          path: |
            artifacts/monitor.json
            artifacts/earnings.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Save cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data/cache
          key: data-cache-${{ hashFiles('requirements.lock') }}-${{ github.run_id }}

      # Only a build that passed --strict is published -- or one whose sole
      # finding is a MONITOR ledger carried forward unchanged, so one panel
      # cannot freeze the whole site -- and never one dated earlier than the
      # live page (scripts/guard_deploy.py).
      - name: Deploy gate
        id: gate
        run: |
          if [ "${{ steps.refresh.outcome }}" = "success" ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            python scripts/deploy_gate.py
          fi

      - name: Deploy
        if: steps.gate.outputs.deployable == 'true' && (github.event_name == 'schedule' || inputs.deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set"
            exit 1
          fi
          make deploy-only

      # A carried MONITOR was published above; the run still fails so a red
      # run emails the owner, as any failed build does.
      - name: Fail a failed build
        if: steps.refresh.outcome != 'success'
        run: |
          echo "::error::Refresh failed (see its log); deploy gate said '${{ steps.gate.outputs.deployable }}'"
          exit 1

      - name: Summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          path = pathlib.Path("artifacts/manifest.json")
          if not path.exists():
              print("No manifest was built.")
          else:
              m = json.loads(path.read_text())
              print(f"**as_of** {m.get('as_of')} &nbsp; **generated_at** {m.get('generated_at')}")
              carried = m.get("monitor_carried")
              if carried:
                  print(f"\n**MONITOR carried forward** (observed to {carried.get('as_of')}, "
                        f"not updated since {carried.get('since')}): {carried.get('reason')}")
              skipped = m.get("skipped_panels") or []
              if skipped:
                  print(f"\nSkipped panels: {', '.join(map(str, skipped))}")
          EOF
