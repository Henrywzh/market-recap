# Nightly refresh + deploy. Runs on GitHub's machines, so whether it happens
# does not depend on a laptop lid being open at the right minute.
name: refresh

on:
  schedule:
    # GitHub cron is UTC. 23:37 UTC is 19:37 New York in summer (EDT) and 18:37
    # in winter (EST): after the evening publishers (State Street holdings/NAV,
    # Treasury's par curve) year-round, with no DST arithmetic to redo twice a
    # year. Off the hour and half hour, which are the slots GitHub delays most.
    - cron: "37 23 * * 1-5"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to Cloudflare Pages after a passing build"
        type: boolean
        default: true

# Two overlapping runs would race on the deploy; a manual run queues instead.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lock, not pyproject's ranges: a clean machine otherwise resolves the
      # newest release that night, and an upgrade should be a commit.
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          npm ci

      - name: Test
        run: python -m pytest tests/ -q

      # The cache is politeness and speed, not state: every artifact rebuilds
      # from the publishers, so an evicted cache costs one slow run, never a
      # wrong number. Each run saves under its own key and restores the newest.
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: Refresh
        # --strict: nobody reads an unattended run's output, so a warning is a
        # failure. A red run emails the repo owner; a stale page does not.
        run: make refresh REFRESH_FLAGS=--strict

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}

      # Only a build that passed --strict is published.
      - name: Deploy
        if: github.event_name == 'schedule' || inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set"
            exit 1
          fi
          make deploy-only

      - name: Summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          path = pathlib.Path("artifacts/manifest.json")
          if not path.exists():
              print("No manifest was built.")
          else:
              m = json.loads(path.read_text())
              print(f"**as_of** {m.get('as_of')} &nbsp; **generated_at** {m.get('generated_at')}")
              skipped = m.get("skipped_panels") or []
              if skipped:
                  print(f"\nSkipped panels: {', '.join(map(str, skipped))}")
          EOF
