# Nightly refresh + deploy. Runs on GitHub's machines, so whether it happens
# does not depend on a laptop lid being open at the right minute.
#
# Two editions a weekday, dispatched on time by a Cloudflare cron Worker
# (workers/dispatch): "close" at 16:20 New York, so the recap is up about half
# an hour after the bell, and "evening" at 18:35, after the evening publishers. GitHub's own schedule
# below starts two to three hours late, so it is only the fallback: it skips
# itself when a current evening edition has passed and is actually published.
#
# Manual runs take a `mode` (scheduled runs and the Worker's dispatches pass
# none, so they are "full", exactly as before):
#   full    fetch and rebuild everything, then test, build, smoke test, deploy.
#   site    skip the refresh: restore the artifacts of the last published build
#           and only re-run the tests, site build, smoke test and deploy. For a
#           change to web/ or functions/ that needs no new data.
#   panels  restore those artifacts, rebuild just `panels` (space-separated
#           names, as `refresh --panels`) on top of them, merge the manifest,
#           then the same test/build/smoke/deploy. For one broken panel.
# Every full or panels run that deploys saves artifacts/ to the Actions cache
# (free; upload-artifact would count against storage), which is what site and
# panels restore. A site or panels run titles itself by its mode, so the
# guard below never mistakes it for an evening edition.
#
# One job, not a guard job plus a refresh job: each job is billed on its own
# and rounded up to a whole minute, so a skipped fallback run still cost two.
name: refresh
run-name: refresh · ${{ github.event_name == 'schedule' && 'scheduled' || (inputs.mode == 'site' || inputs.mode == 'panels') && inputs.mode || inputs.edition || 'evening' }}

on:
  schedule:
    # GitHub cron is UTC. 23:47 UTC is 19:47 New York in summer (EDT) and 18:47
    # in winter (EST): after the evening publishers (State Street holdings/NAV,
    # Treasury's par curve) and the 18:30 session rollover year-round, with no
    # DST arithmetic to redo twice a year -- 17 minutes clear of the rollover in
    # winter rather than 7. Off the hour and half hour, which GitHub delays most.
    - cron: "47 23 * * 1-5"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to Cloudflare Pages after a passing build"
        type: boolean
        default: true
      edition:
        description: "close: 16:20 New York, the session's prices; evening: 18:35, after the evening publishers"
        type: choice
        options: [evening, close]
        default: evening
      mode:
        description: "full: rebuild everything; site: redeploy the last published data with the current code; panels: rebuild only the panels below"
        type: choice
        options: [full, site, panels]
        default: full
      panels:
        description: "mode=panels only: space-separated panel names, e.g. 'markets risk'"
        type: string
        default: ""

# Two overlapping runs would race on the deploy; a manual run queues instead.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      MODE: ${{ inputs.mode || 'full' }}
      PANELS: ${{ inputs.panels }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      # The late GitHub schedule repeats work only when the Worker's evening
      # dispatch did not happen or did not pass. Every step below is gated on
      # its answer: a skipped run does nothing after this point.
      # Calendar + honest HTTP client only; all transitive versions are
      # constrained by the same lock as the build itself.
      - name: Install guard dependencies
        if: github.event_name == 'schedule'
        run: python -m pip install -c requirements.lock pandas httpx

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          since=$(date -u -d '10 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          done=$(gh run list -R "${{ github.repository }}" --workflow refresh.yml --status success \
            --created ">=$since" --json displayTitle -q '[.[] | select(.displayTitle == "refresh · evening")] | length')
          python -m market_recap.refresh_guard --successful-evenings "${done:-0}"

      - uses: actions/setup-node@v7
        if: steps.check.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      # The lock, not pyproject's ranges: a clean machine otherwise resolves the
      # newest release that night, and an upgrade should be a commit.
      - name: Install
        if: steps.check.outputs.run == 'true'
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          # Pinned here, not in the lock: the lock's hash keys the data cache.
          python -m pip install pyflakes==4.0.0
          npm ci

      # The panel list goes to the shell through the environment, never into
      # the script text, and must look like panel names.
      - name: Check mode inputs
        if: steps.check.outputs.run == 'true' && env.MODE == 'panels'
        run: |
          if ! printf '%s' "$PANELS" | grep -Eq '^[a-z_]+( +[a-z_]+)*$'; then
            echo "::error::mode=panels needs 'panels' as space-separated panel names (got '$PANELS')"
            exit 1
          fi
          # build.run silently drops a name it does not know, which would
          # publish an unchanged page from a run that looks like it worked.
          python -c "import os, sys; from market_recap.build import PANELS; bad = [p for p in os.environ['PANELS'].split() if p not in PANELS]; sys.exit('::error::unknown panel(s): ' + ' '.join(bad) + '; known: ' + ' '.join(PANELS)) if bad else None"

      - name: Test
        if: steps.check.outputs.run == 'true'
        run: make test PYTHON=python

      # The cache is politeness and speed, not state: every artifact rebuilds
      # from the publishers, so an evicted cache costs one slow run, never a
      # wrong number. Each run saves under its own key and restores the newest
      # -- but only one written by the same locked library versions. A cache
      # built by pandas 3 / yfinance 1 once put the page a session behind.
      # THEMES reads Korea's monthly trade release from its PDF.
      # A site run fetches nothing, so it skips this and the next three steps.
      - name: Install pdftotext
        if: steps.check.outputs.run == 'true' && env.MODE != 'site'
        run: command -v pdftotext || { sudo apt-get update -q && sudo apt-get install -y -q poppler-utils; }

      - name: Restore cache
        if: steps.check.outputs.run == 'true' && env.MODE != 'site'
        uses: actions/cache/restore@v6
        with:
          path: data/cache
          key: data-cache-${{ hashFiles('requirements.lock') }}-${{ github.run_id }}
          restore-keys: data-cache-${{ hashFiles('requirements.lock') }}-

      # The last published build's artifacts, saved by the Save step below. The
      # run_id key never matches, so this always falls back to the newest
      # published-artifacts-* entry. The Actions cache is free; artifacts/ is
      # ignored by git, so this is the only copy a site or panels run has.
      - name: Restore published artifacts
        id: published
        if: steps.check.outputs.run == 'true' && env.MODE != 'full'
        uses: actions/cache/restore@v6
        with:
          path: artifacts
          key: published-artifacts-${{ github.run_id }}
          restore-keys: published-artifacts-

      - name: Require published artifacts
        if: steps.check.outputs.run == 'true' && env.MODE != 'full'
        run: |
          if [ -z "${{ steps.published.outputs.cache-matched-key }}" ] || [ ! -f artifacts/manifest.json ]; then
            echo "::error::no published artifacts cached yet; run mode=full once"
            exit 1
          fi
          echo "restored ${{ steps.published.outputs.cache-matched-key }}"
          # What the merge below needs: the manifest the panels run overwrites.
          cp artifacts/manifest.json "$RUNNER_TEMP/previous-manifest.json"

      # Recorded rates and options pricing, read by PRICED PATH and the ticker
      # page. Read-only and optional: a missing branch leaves those sections
      # saying "not recorded yet".
      - name: Check out recorded snapshots
        if: steps.check.outputs.run == 'true' && env.MODE != 'site'
        continue-on-error: true
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" snapshots >/dev/null; then
            git clone -q --depth 1 --branch snapshots --single-branch "$REMOTE" data/snapshots
          fi

      - name: Refresh
        id: refresh
        if: steps.check.outputs.run == 'true' && env.MODE != 'site'
        # A failed build is judged by the gate below, then fails the run at the end.
        continue-on-error: true
        env:
          # Restore the last published ledgers (MONITOR observations, the earnings
          # season's captured year-ago EPS), never an evictable cache.
          MONITOR_PUBLISHED_STATE: "1"
          # Preserve observed CPI/PPI versions independently of the TTL cache.
          INFLATION_PUBLISHED_STATE: "1"
          # THEMES reads alternative-data's files and asks GitHub which commit
          # last touched each; the anonymous API limit is 60 an hour per IP.
          GITHUB_TOKEN: ${{ github.token }}
          # THEMES dates FRED series by their first release (ALFRED); without
          # it the release days are approximated and the studies left out.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # TICKER's headlines on large-move days and announced company
          # events; without it moves are explained from filings and data only.
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # The close edition needs no cache override: Yahoo's prices cached
          # before 16:15 are stale after it (sources/yahoo._read), and every
          # other daily file is last evening's until the 18:30 rollover, when
          # the evening edition fetches them again.
          MARKET_RECAP_EDITION: ${{ inputs.edition || 'evening' }}
        # --strict: nobody reads an unattended run's output, so a warning is a
        # failure. A red run emails the repo owner; a stale page does not.
        # A panels run is `refresh --panels X --keep-cache` on top of the
        # restored artifacts, as it is locally: the other panels' files stay
        # as they are, and no cache entry is pruned on a partial build.
        run: |
          if [ "$MODE" = "panels" ]; then
            make refresh REFRESH_FLAGS="--strict --keep-cache --panels $PANELS"
          else
            make refresh REFRESH_FLAGS=--strict
          fi

      # The refresh wrote a manifest that lists only the panels it built; this
      # puts the rest back (scripts/merge_manifest.py) and validates the whole.
      # It runs after a failed refresh too, so the gate judges the merged set.
      - name: Merge manifest
        id: merge
        if: steps.check.outputs.run == 'true' && env.MODE == 'panels'
        continue-on-error: true
        run: python scripts/merge_manifest.py "$RUNNER_TEMP/previous-manifest.json"

      - name: Archive monitor observations
        if: always() && steps.check.outputs.run == 'true' && env.MODE != 'site'
        uses: actions/upload-artifact@v7
        with:
          name: monitor-${{ github.run_id }}
          path: |
            artifacts/monitor.json
            artifacts/earnings.json
            artifacts/macro.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Save cache
        if: always() && steps.check.outputs.run == 'true' && env.MODE != 'site'
        uses: actions/cache/save@v6
        with:
          path: data/cache
          key: data-cache-${{ hashFiles('requirements.lock') }}-${{ github.run_id }}

      # Every page of the built site opened in headless Chrome (the runner's
      # own): a page that throws, logs an error, renders nothing or shows NaN
      # blocks the deploy like a failed build.
      - name: Smoke test the site
        id: smoke
        if: always() && steps.check.outputs.run == 'true'
        continue-on-error: true
        run: make smoke PYTHON=python

      # Only a build that passed --strict is published -- or one whose sole
      # finding is a MONITOR ledger carried forward unchanged, so one panel
      # cannot freeze the whole site -- and never one dated earlier than the
      # live page (scripts/guard_deploy.py). A site run has no refresh outcome
      # (it was skipped), so the restored artifacts go through the same
      # validation as a failed build's.
      - name: Deploy gate
        id: gate
        if: steps.check.outputs.run == 'true'
        run: |
          if [ "${{ steps.smoke.outcome }}" != "success" ] || [ "${{ steps.merge.outcome }}" = "failure" ]; then
            echo "deployable=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.edition }}" = "close" ] && [ "$(python -c 'import json; print(json.load(open("artifacts/manifest.json"))["as_of"])')" != "$(TZ=America/New_York date +%F)" ]; then
            # Not every close was printed yet: a close edition of yesterday's
            # session would only relabel the page. The evening build follows.
            echo "::notice::close edition found no complete session for today; not published"
            echo "deployable=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.refresh.outcome }}" = "success" ] && [ "$MODE" != "panels" ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            python scripts/deploy_gate.py
          fi

      - name: Deploy
        id: deploy
        if: steps.check.outputs.run == 'true' && steps.gate.outputs.deployable == 'true' && (github.event_name == 'schedule' || inputs.deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set"
            exit 1
          fi
          make deploy-only

      # What was just published, for the next site or panels run. Only a
      # deployed build: an undeployed one is not what the site shows, and a
      # site run saves nothing (it deployed what it restored).
      - name: Save published artifacts
        if: steps.deploy.outcome == 'success' && env.MODE != 'site'
        uses: actions/cache/save@v6
        with:
          path: artifacts
          key: published-artifacts-${{ github.run_id }}

      # A carried MONITOR was published above; the run still fails so a red
      # run emails the owner, as any failed build does.
      - name: Fail a failed build
        if: steps.check.outputs.run == 'true' && (steps.refresh.outcome == 'failure' || steps.merge.outcome == 'failure' || steps.smoke.outcome != 'success')
        run: |
          echo "::error::Refresh: ${{ steps.refresh.outcome }}, merge: ${{ steps.merge.outcome }}, smoke test: ${{ steps.smoke.outcome }} (see their logs); deploy gate said '${{ steps.gate.outputs.deployable }}'"
          exit 1

      - name: Summary
        if: always() && steps.check.outputs.run == 'true'
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          print(f"**mode** {os.environ['MODE']}" + (f" &nbsp; **panels** {os.environ['PANELS']}" if os.environ["MODE"] == "panels" else ""))
          path = pathlib.Path("artifacts/manifest.json")
          if not path.exists():
              print("No manifest was built.")
          else:
              m = json.loads(path.read_text())
              print(f"**as_of** {m.get('as_of')} &nbsp; **generated_at** {m.get('generated_at')}")
              carried = m.get("monitor_carried")
              if carried:
                  print(f"\n**MONITOR carried forward** (observed to {carried.get('as_of')}, "
                        f"not updated since {carried.get('since')}): {carried.get('reason')}")
              skipped = m.get("skipped_panels") or []
              if skipped:
                  print(f"\nSkipped panels: {', '.join(map(str, skipped))}")
          EOF
