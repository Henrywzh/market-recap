# Record what cannot be downloaded later (src/market_recap/snapshots): one
# option-chain snapshot late in each session, the rates / event-market
# pricing a few times a day, and the risk inputs as published each evening.
# Each run commits what it wrote to the orphan `snapshots` branch, which
# holds data only; the nightly refresh reads it when a usable snapshot exists.
#
# It touches no build, cache or deploy, and a failed snapshot does not affect
# the nightly refresh.
name: snapshots

on:
  schedule:
    # Three starts for the options chain: 15:10 New York in summer (19:10 UTC)
    # and in winter (20:10 UTC), so each season gets an in-session chain, and a
    # 21:40 UTC fallback (GitHub schedules can start hours late; the window runs
    # to midnight). The 19:10 start is outside the window in winter and exits at
    # once; an idempotence guard skips any later copy once one is good.
    - cron: "10 19 * * 1-5"
    - cron: "10 20 * * 1-5"
    - cron: "40 21 * * 1-5"
    # Expectations: four times a weekday, from the open to after the close.
    - cron: "41 13,16,19,22 * * 1-5"
    # Risk inputs as published: once each weekday evening, after FRED, OFR
    # and Cboe have posted the session.
    - cron: "17 23 * * 1-5"
    # Consensus EPS for every valued company, each weekday evening: the only
    # way a forward P/E gets a history.
    - cron: "47 23 * * 1-5"
    # The European names' multiples and consensus (Yahoo's own forward and
    # trailing P/E), the same evening: the only way they get a history.
    - cron: "57 23 * * 1-5"
  workflow_dispatch:
    inputs:
      kind:
        description: "What to record"
        type: choice
        options: [options, expectations, risk, consensus, europe]
        default: expectations
      force:
        description: "options: record even outside the New York window"
        type: boolean
        default: false

# Two runs must not race on the branch; a later one queues.
concurrency:
  group: snapshots
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: src
      BRANCH: snapshots
    steps:
      - name: Kind
        id: kind
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.kind }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "41 13,16,19,22 * * 1-5" ]; then
            echo "kind=expectations" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 23 * * 1-5" ]; then
            echo "kind=risk" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "47 23 * * 1-5" ]; then
            echo "kind=consensus" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "57 23 * * 1-5" ]; then
            echo "kind=europe" >> "$GITHUB_OUTPUT"
          else
            echo "kind=options" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .

      # Shallow: the branch only ever grows, and a run needs none of its past.
      - name: Check out the snapshots branch
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" "$BRANCH" >/dev/null; then
            git clone --depth 1 --branch "$BRANCH" --single-branch "$REMOTE" data/snapshots
          else
            mkdir -p data/snapshots && cd data/snapshots
            git init -q && git checkout -q --orphan "$BRANCH"
            git remote add origin "$REMOTE"
            printf '# snapshots\n\nData only, written by .github/workflows/snapshots.yml on main.\nSee docs/information_architecture.md there.\n' > README.md
          fi

      - name: Snapshot
        id: run
        run: |
          set -o pipefail
          python -m market_recap.cli snapshot "${{ steps.kind.outputs.kind }}" --root data/snapshots \
            ${{ inputs.force && '--force' || '' }} | tee snapshot.json

      - name: Commit
        working-directory: data/snapshots
        run: |
          git config user.name "market-recap snapshots"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing written."
            exit 0
          fi
          git commit -q -m "snapshot: ${{ steps.kind.outputs.kind }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git push -q origin "HEAD:$BRANCH"; then exit 0; fi
            sleep $((attempt * 5))
            git pull -q --rebase --depth 1 origin "$BRANCH" || true
          done
          echo "::error::could not push to $BRANCH"
          exit 1

      - name: Summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          path = pathlib.Path("snapshot.json")
          if not path.exists():
              print("The snapshot did not run.")
          else:
              result = json.loads(path.read_text())
              print(f"**{result.get('status')}** {result.get('reason') or ''}")
              for key in ("underlyings_ok", "summary_rows", "contract_rows", "rows", "companies", "seconds"):
                  if key in result:
                      print(f"- {key}: {result[key]}")
              failed = result.get("failed") or {}
              if failed:
                  print(f"\nFailed ({len(failed)}): " + "; ".join(f"{k}: {v}" for k, v in list(failed.items())[:20]))
          EOF
