# Research: can FactSet's weekly Earnings Insight PDF give a sector forward P/E,
# and how far back? scripts/probe_factset_sector.py asks for six years of weekly
# PDFs, finds the sector page, and says whether its numbers are selectable text
# or only pixels (then whether OCR reads them). Manual only: it is a one-off
# question, and it touches no build, cache or deploy.
#
# Read summary.json in the uploaded artifact. Write a reader only if
# sector_numbers_selectable_as_text or sector_numbers_read_by_ocr covers most of
# the weeks found and implausible_moves is empty.
name: probe-factset

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of weekly PDFs to ask for"
        default: "6"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr

      - name: Probe
        run: python scripts/probe_factset_sector.py --years "${{ inputs.years || '6' }}" --out probes/factset --keep-newest

      - uses: actions/upload-artifact@v7
        with:
          name: probe-factset-${{ github.run_id }}
          path: probes/factset/
          retention-days: 30
